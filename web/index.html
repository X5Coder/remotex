<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="RemoteX - control your computer from any browser. Peer-to-peer, end-to-end encrypted.">
  <title>RemoteX — Your computer, from any browser</title>
  <link rel="icon" type="image/png" href="./icon.png" sizes="512x512">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="stylesheet" href="./src/style.css">
  <script>(function(){try{var t=localStorage.getItem('remotex.theme');if(t==='dark')document.documentElement.dataset.theme='dark';if(localStorage.getItem('remotex.hideArrow')==='1')document.documentElement.classList.add('hide-arrow');}catch(e){}})();</script>
</head>
<body>

<!-- ============ Connect screen ============ -->
<div class="connectScreen" id="connectScreen">

  <form class="hero" id="connectForm" autocomplete="on" novalidate>
    <div class="heroText">
      <h1 class="wordmark">RemoteX</h1>
      <p class="tagline">Your computer, from any browser.</p>
    </div>

    <div class="fields">
      <div class="field">
        <label for="roomId">Device ID</label>
        <input id="roomId" name="roomId" type="text" inputmode="numeric" autocapitalize="off" autocorrect="off" spellcheck="false"
          placeholder="012345" autocomplete="off" maxlength="6" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false"
          placeholder="PASSWORD" autocomplete="off" maxlength="6" required>
      </div>
      <button class="connectBtn" id="connectBtn" type="submit" disabled><span class="spin" aria-hidden="true"></span><span class="connectLabel">Connect</span></button>
    </div>

    <p class="trust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>End-to-end encrypted — only you can see the screen.</p>

    <div class="footRow">
      <a class="ghLink" href="https://github.com/X5Coder/remotex" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        Free &amp; open source
      </a>
      <span class="footRight">
        <button class="iconBtn small" data-open-settings aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <span class="verTag">RemoteX v6.2.11</span>
      </span>
    </div>
  </form>

  <!-- settings dialog -->
  <div class="overlay" id="settingsOverlay" hidden>
    <div class="dialog" id="settingsDialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="dialogHead">
        <h2 class="dialogTitle" id="settingsTitle">Settings</h2>
        <button class="iconBtn small" id="settingsClose" aria-label="Close settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dialogBody">
        <div class="settingRow">
          <div class="settingInfo">
            <span class="settingName">Appearance</span>
            <span class="settingHint">Light by default — dark for night work</span>
          </div>
          <div class="segmented" id="themeSeg" role="group" aria-label="Theme">
            <button class="segBtn isOn" data-theme-btn="light" type="button">Light</button>
            <button class="segBtn" data-theme-btn="dark" type="button">Dark</button>
          </div>
        </div>
        <div class="settingRow">
          <div class="settingInfo">
            <span class="settingName">Arrow cursor</span>
            <span class="settingHint">Hide the on-screen arrow (site only)</span>
          </div>
          <button class="switch" id="arrowSwitch" role="switch" aria-checked="true" aria-label="Toggle arrow cursor"><span class="knob"></span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ Remote surface (hidden until connected) ============ -->
<div class="app" id="app" hidden>
  <!-- main-page toolbar: default (small) view only; hidden in focus/land like the 3-button bar -->
  <div class="rToolbar" id="rToolbar" role="banner" aria-label="RemoteX">
    <span class="rBrand"><img class="rMark" src="./icon.png" width="20" height="20" alt=""> RemoteX</span>
    <span class="rSpacer"></span>
    <button class="iconBtn small" data-open-settings aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div id="backdrop"></div>
  <div id="shade"></div>
  <canvas id="glow"></canvas>
  <div class="panel" id="panel">
    <div class="screenWrap" id="screenWrap">
      <div class="screen" id="screen">
        <video id="remote-screen" autoplay playsinline muted></video>
        <div class="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>Waiting for the screen stream...</span>
        </div>
        <svg id="cursor" viewBox="0 0 19 21" width="19" height="21"><path d="M0 0 L18 9.8 L10.5 11.7 L7 20 Z" fill="#f4f4f4" stroke="#1b2a3a" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <div class="lui">
          <button class="btn" id="leftBtn2" type="button" aria-label="Left click">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="6"/><path d="M12 2.5v8M6 10.5h12"/><path d="M12 2.5v8H6v-2a6 6 0 0 1 6-6z" fill="currentColor"/></svg>
          </button>
          <button class="btn" id="rightBtn2" type="button" aria-label="Right click">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="6"/><path d="M12 2.5v8M6 10.5h12"/><path d="M12 2.5v8h6v-2a6 6 0 0 0-6-6z" fill="currentColor"/></svg>
          </button>
          <button class="btn kb" id="kbBtn2" type="button" aria-label="Keyboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
          </button>
          <button class="btn" id="settingsBtnLand" type="button" data-open-settings aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <button class="btn" id="exitBtn" type="button" aria-label="Exit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="btns">
      <button class="btn" id="leftBtn" type="button">Left Click</button>
      <button class="btn" id="rightBtn" type="button">Right Click</button>
      <button class="btn kb" id="kbBtn" type="button" aria-label="Keyboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ============ Tablet dock: on-screen keyboard button ============ -->
<div class="dock" id="dock" hidden>
  <button class="btn kb" id="kbBtn3" type="button" aria-label="Keyboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
  </button>
</div>

<div id="toast"></div>
<input id="kbInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
<script type="module" src="./src/main.ts"></script>
</body>
</html>
