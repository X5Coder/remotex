name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol (unit tests) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: protocol/package-lock.json
      - working-directory: protocol
        run: npm ci
      - working-directory: protocol
        run: npm test

  web:
    name: Web client (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            protocol/package-lock.json
            web/package-lock.json
      - working-directory: protocol
        run: npm ci && npm run build
      - working-directory: web
        run: npm ci && npm run build

  agent:
    name: Agent (typecheck + build) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            protocol/package-lock.json
            agent/package-lock.json
      # Native toolchain for @jitsi/robotjs (node-gyp)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libpng-dev python3 make g++
      - working-directory: protocol
        run: npm ci && npm run build
      - working-directory: agent
        run: npm ci && npm run build
