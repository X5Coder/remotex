name: Release agents (Windows / macOS / Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    name: Package — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            protocol/package-lock.json
            agent/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libpng-dev python3 make g++
      - working-directory: protocol
        run: npm ci && npm run build
      - working-directory: agent
        run: npm ci && npm run build
      # GCC 14 treats implicit function declarations as errors; @jitsi/robotjs' xdisplay.c
      # calls strdup with neither _GNU_SOURCE nor <string.h>. Inject both before the rebuild.
      - if: runner.os == 'Linux'
        working-directory: agent
        run: |
          sed -i '1i #include <string.h>' node_modules/@jitsi/robotjs/src/xdisplay.c
          sed -i '1i #define _GNU_SOURCE' node_modules/@jitsi/robotjs/src/xdisplay.c
      # npm skips optional deps for the OTHER arch on macOS (runner is arm64, so the x64
      # koffi.node never lands in node_modules and the x64.universal merge sees identical
      # arm64 binaries in both slices). Force-install both koffi arch packages — then the
      # per-arch files are legitimately different and electron-builder's universal build is happy.
      - if: runner.os == 'macOS'
        working-directory: agent
        run: |
          KV="$(node -p "require('./node_modules/koffi/package.json').version")"
          npm install --no-save --os=darwin --cpu=x64 "@koromix/koffi-darwin-x64@$KV"
          npm install --no-save --os=darwin --cpu=arm64 "@koromix/koffi-darwin-arm64@$KV"
      - name: Build & upload to release
        working-directory: agent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ runner.os }}" in
            Windows) npx electron-builder --win --x64 --arm64 --publish always ;;
            macOS)   npx electron-builder --mac --universal --publish always ;;
            Linux)   npx electron-builder --linux AppImage deb rpm --publish always ;;
          esac

      - name: Build native deps marker (nothing to do — electron-builder rebuilds)
        run: echo "electron-builder npmRebuild=true handles @jitsi/robotjs for the packaged ABI"
