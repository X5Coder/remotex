name: Release agents (Windows / macOS / Linux)

# Exactly three artifacts are built — Windows (RemoteX-Setup.exe), macOS
# (RemoteX.dmg) and Linux (RemoteX.AppImage) — and uploaded to the release
# matching the pushed tag. Nothing else is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            protocol/package-lock.json
            agent/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libpng-dev python3 make g++
      - working-directory: protocol
        run: npm ci && npm run build
      - working-directory: agent
        run: npm ci && npm run build
      # GCC 14 treats implicit function declarations as errors; @jitsi/robotjs' xdisplay.c
      # calls strdup with neither _GNU_SOURCE nor <string.h>. Inject both before the rebuild.
      - if: runner.os == 'Linux'
        working-directory: agent
        run: |
          sed -i '1i #include <string.h>' node_modules/@jitsi/robotjs/src/xdisplay.c
          sed -i '1i #define _GNU_SOURCE' node_modules/@jitsi/robotjs/src/xdisplay.c
      # npm skips optional deps for the OTHER arch on macOS (runner is arm64, so the x64
      # koffi.node never lands in node_modules). Pull the exact-version tarball straight from
      # the registry and unpack it — no npm platform checks. Universal dmg packs from this
      # same tree; each slice loads its native koffi at runtime.
      - if: runner.os == 'macOS'
        working-directory: agent
        run: |
          KV="$(node -p "require('./node_modules/koffi/package.json').version")"
          npm pack "@koromix/koffi-darwin-x64@$KV" --ignore-scripts
          mkdir -p node_modules/@koromix/koffi-darwin-x64
          tar -xzf koromix-koffi-darwin-x64-$KV.tgz -C node_modules/@koromix/koffi-darwin-x64 --strip-components=1
          rm koromix-koffi-darwin-x64-$KV.tgz
      - name: Build (no publish)
        working-directory: agent
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) npx electron-builder --win --x64 --publish never ;;
            macOS)   npx electron-builder --mac --universal --publish never ;;
            Linux)   npx electron-builder --linux AppImage --x64 --publish never ;;
          esac
      - name: Upload to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: agent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd release
          ls -la
          case "${{ runner.os }}" in
            Windows) mv RemoteX.exe RemoteX-Setup.exe && gh release upload "${GITHUB_REF_NAME}" RemoteX-Setup.exe --clobber ;;
            macOS)   gh release upload "${GITHUB_REF_NAME}" RemoteX.dmg --clobber ;;
            Linux)   gh release upload "${GITHUB_REF_NAME}" RemoteX.AppImage --clobber ;;
          esac
