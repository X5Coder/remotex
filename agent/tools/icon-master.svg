<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" width="512" height="512" role="img" aria-label="Laptop and phone communicating">
  <defs>
    <linearGradient id="blackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="288" height="288" rx="44" ry="44" fill="#ffffff"/>
  <g transform="translate(16 7.5)">
    <!-- sparks -->
    <g stroke="#1a1a1a" stroke-width="7" stroke-linecap="round">
      <line x1="202" y1="44" x2="202" y2="66"/>
      <line x1="180" y1="52" x2="189" y2="68"/>
      <line x1="224" y1="52" x2="215" y2="68"/>
    </g>
    <g filter="url(#shadow)">
      <!-- laptop -->
      <rect x="34" y="84" width="140" height="98" rx="14" fill="#fff" stroke="url(#blackGrad)" stroke-width="12"/>
      <rect x="18" y="190" width="172" height="14" rx="7" fill="url(#blackGrad)"/>
      <!-- phone (white cutout keeps it clean over the laptop) -->
      <rect x="170" y="104" width="62" height="112" rx="16" fill="#fff" stroke="#fff" stroke-width="26"/>
      <rect x="170" y="104" width="62" height="112" rx="16" fill="#fff" stroke="url(#blackGrad)" stroke-width="12"/>
      <rect x="190" y="116" width="22" height="5" rx="2.5" fill="url(#blackGrad)"/>
    </g>
  </g>
</svg>
