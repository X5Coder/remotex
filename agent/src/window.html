<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>RemoteX</title>
<style>
  :root{
    --bg:#eceff3;--ink:#1f2733;--muted:#8b95a5;--line:#d3d9e2;--accent:#5b6676;
    --card:#fbfcfd;--ok:#3a7d44;--err:#a63a3a;--warn:#b8913a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html,body{height:100%}
  body{
    background:var(--bg) linear-gradient(170deg,#ffffff 0%,#eef0f4 45%,#d9dde4 100%);
    color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden
  }

  /* ---------- title bar ---------- */
  .titlebar{height:44px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;
    -webkit-app-region:drag;border-bottom:1px solid rgba(211,217,226,.6)}
  .titlebar img{width:19px;height:19px;-webkit-app-region:no-drag}
  .titlebar .tbTitle{font-size:12.5px;font-weight:700;letter-spacing:.4px;color:#1f2733;flex:1;white-space:nowrap}
  .tbBtn{-webkit-app-region:no-drag;width:38px;height:32px;border:0;background:transparent;border-radius:8px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5b6676;touch-action:manipulation}
  .tbBtn:hover{background:rgba(31,39,51,.07);color:#1f2733}
  .tbBtn.close:hover{background:#a63a3a;color:#fff}
  .tbBtn svg{width:13px;height:13px;stroke-width:2}

  /* ---------- content ---------- */
  .wrap{display:flex;flex-direction:column;gap:14px;padding:18px 18px 16px;height:calc(100% - 44px);overflow:hidden}

  .card{background:linear-gradient(165deg,#fbfcfd 0%,#e7eaef 100%);border:1px solid var(--line);
    border-radius:20px;padding:14px 14px;box-shadow:0 12px 26px -16px rgba(60,70,90,.4),inset 0 1px 0 #fff}
  .label{font-size:10px;letter-spacing:1.8px;color:var(--accent);font-weight:800;text-transform:uppercase;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:10px}
  .monoVal{flex:1;min-width:0;height:48px;display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    font-family:"Cascadia Mono","Consolas","SF Mono",Menlo,monospace;font-weight:700;font-size:20px;
    letter-spacing:3px;color:#1f2733;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    -webkit-user-select:text;user-select:text}
  .monoVal.pass{color:#2b3340;letter-spacing:6px}

  .iconBtn{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(165deg,#ffffff,#eef0f4);color:#3d4a5c;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s,transform .15s;touch-action:manipulation}
  .iconBtn:hover{border-color:var(--accent);color:var(--accent)}
  .iconBtn:active{transform:scale(.94)}
  .iconBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .iconBtn.ok{border-color:var(--ok);color:var(--ok)}
  .iconBtn svg{width:18px;height:18px}

  .statusRow{display:flex;align-items:center;gap:10px;font-size:13px;color:#2e2a22;line-height:1.45;min-height:22px}
  .dot{width:10px;height:10px;border-radius:50%;background:#c3cad4;flex:none}
  .dot.waiting{background:var(--warn);animation:pulse 1.4s ease-in-out infinite alternate}
  .dot.connected{background:var(--ok)}
  .dot.error{background:var(--err)}
  @keyframes pulse{from{opacity:.4}to{opacity:1}}

  .btnTerminate{height:52px;border-radius:14px;cursor:pointer;font:inherit;font-size:14px;font-weight:800;letter-spacing:.6px;
    color:var(--err);background:#fff;border:1px solid #e0c4c4;transition:border-color .15s,background .15s,transform .15s;touch-action:manipulation}
  .btnTerminate:hover:not(:disabled){background:#fdf4f4;border-color:var(--err)}
  .btnTerminate:active:not(:disabled){transform:scale(.98)}
  .btnTerminate:disabled{opacity:.4;cursor:default}
  .btnTerminate:focus-visible{outline:2px solid var(--err);outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
  <div class="titlebar">
    <img src="icon.png" alt="RemoteX">
    <span class="tbTitle">RemoteX</span>
    <button class="tbBtn" id="minBtn" aria-label="Minimize" title="Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </button>
    <button class="tbBtn close" id="closeBtn" aria-label="Close" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="wrap">

    <!-- Status -->
    <div class="card">
      <div class="label">Status</div>
      <div class="statusRow"><span class="dot waiting" id="dot"></span><span id="statusText">Waiting for a connection…</span></div>
    </div>

    <!-- Device ID -->
    <div class="card">
      <div class="label">Device ID</div>
      <div class="row">
        <div class="monoVal" id="roomId">——</div>
        <button class="iconBtn" id="copyId" title="Copy Device ID" aria-label="Copy Device ID"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
      </div>
    </div>

    <!-- Password -->
    <div class="card">
      <div class="label">Password · new every launch</div>
      <div class="row">
        <div class="monoVal pass" id="password">——————</div>
        <button class="iconBtn" id="newPasswordBtn" title="New password" aria-label="New password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
        <button class="iconBtn" id="copyPass" title="Copy password" aria-label="Copy password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
      </div>
    </div>

    <button class="btnTerminate" id="terminateBtn" disabled>Terminate</button>

  </div>

<script>
const r = window.remotex;
const $ = (id) => document.getElementById(id);
const minBtn = $('minBtn'), closeBtn = $('closeBtn');

if (!r) {
  const st = $('statusText');
  if (st) st.textContent = 'Preload failed — reinstall RemoteX.';
  const d = $('dot'); if (d) d.className = 'dot error';
} else {
  minBtn.addEventListener('click', () => r.invoke('win:minimize'));
  closeBtn.addEventListener('click', () => r.invoke('win:close'));

  async function loadIdentity() {
    const id = await r.invoke('agent:identity');
    $('roomId').textContent = id.roomId;
    $('password').textContent = id.password;
  }

  function flashCopied(btn) {
    if (btn.dataset.busy) return;
    const original = btn.innerHTML;
    btn.dataset.busy = '1';
    btn.classList.add('ok');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    setTimeout(() => {
      btn.classList.remove('ok');
      btn.innerHTML = original;
      delete btn.dataset.busy;
    }, 1600);
  }

  $('copyId').addEventListener('click', async () => { await r.invoke('agent:copy', $('roomId').textContent); flashCopied($('copyId')); });
  $('copyPass').addEventListener('click', async () => { await r.invoke('agent:copy', $('password').textContent); flashCopied($('copyPass')); });

  $('newPasswordBtn').addEventListener('click', async () => {
    const btn = $('newPasswordBtn');
    if (btn.dataset.busy) return;
    btn.dataset.busy = '1';
    btn.classList.add('ok');
    try {
      const res = await r.invoke('agent:new-password');
      if (res && res.password) $('password').textContent = res.password;
    } finally {
      setTimeout(() => {
        btn.classList.remove('ok');
        delete btn.dataset.busy;
      }, 900);
    }
  });

  $('terminateBtn').addEventListener('click', () => { r.invoke('session:stop'); });

  r.on('status:update', (p) => {
    const dot = $('dot');
    dot.className = 'dot ' + (p.tone || 'waiting');
    $('statusText').textContent = p.text || '';
    $('terminateBtn').disabled = p.tone !== 'connected';
  });

  loadIdentity();
}
</script>
</body>
</html>
