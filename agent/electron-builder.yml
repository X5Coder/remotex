appId: com.remotex.app
productName: RemoteX
copyright: Copyright © 2026 RemoteX contributors
directories:
  output: release

# release title (the tag is always v + package.json version — v5.12.0, matching the CI tag)
releaseInfo:
  releaseName: v5.12.0
  releaseNotes: |
    v5.12 — cursor restore on remote-input idle

    - Agent: the host OS arrow now RESTORES automatically after 3 s of remote silence
      (a live-but-idle web browser session, or a dead tab the agent never got a clean bye from).
      The client's 1 Hz `curping` keepalive no longer counts as untameable remote control.
      Launching the agent always re-asserts the original arrow.
    - Web (v5.11): the X button in land fullscreen now returns straight to the normal small view
      with a smooth transform FLIP (spring-out), instead of a dimmed portrait-focus state where
      any tap afterwards replayed a janky return animation.
npmRebuild: true # rebuild @jitsi/robotjs against the packaged Electron ABI
files:
  - dist/**
  - platform/**
  - package.json
  - LICENSE
asar: true
compression: maximum

# Elevation model: the GUI runs asInvoker — Chromium screen capture breaks under elevation.
# Lid-close keep-awake is done by a one-shot elevated helper (see platform/windows/power.js),
# so the user sees ONE UAC prompt at launch (optional) instead of running the whole app as admin.
# NSIS itself elevates at install time (perMachine).
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]
  requestedExecutionLevel: asInvoker
  icon: dist/icon.ico
nsis:
  perMachine: true
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: RemoteX

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.utilities
  icon: dist/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  # signing/notarization is a release decision: set CSC_LINK + APPLE_ID creds in CI
  # when a Developer ID is available; unsigned builds require right-click > Open.

linux:
  target:
    - AppImage
    - deb
    - rpm
  # electron-builder derives executableName from package.json "name" by default;
  # "@remotex/agent" produces "@remotexagent", which AppImage rejects
  executableName: remotex-agent
  category: Utility
  icon: dist/icon.png
  desktop:
    entry:
      Name: RemoteX
      Comment: Control this computer from a browser
      Categories: Utility;Network;

publish:
  provider: github
  owner: X5Coder
  repo: remotex
  releaseType: release
