appId: com.remotex.app
productName: RemoteX
copyright: Copyright © 2026 RemoteX contributors
directories:
  output: release

# release title (the tag is always v + package.json version — v5.13.1, matching the CI tag)
releaseInfo:
  releaseName: v5.13.1
  releaseNotes: |
    v5.13.1 — cursor restore hardening + WH_MOUSE_LL physical mouse watch

    - Agent: SetSystemCursor now uses FRESHLY loaded cursor handles on every show/hide
      (the system DESTROYS cursors it takes — the cached handles went stale and the
      restore failed silently, leaving this PC permanently cursorless after a previous
      session/crash). One automatic retry added. before-quit ALSO re-asserts the arrow.
    - Agent (v5.13): WH_MOUSE_LL low-level hook in a worker thread — any real
      USB/Bluetooth mouse / laptop trackpad report instantly hands cursor ownership back
      to the local desktop, even while a remote session is driving. SendInput injections
      are flagged INJECTED and filtered out (same-machine browser relays are ignored
      within 150 ms of a physical touch). v5.13.0 vs this: visibility only.
npmRebuild: true # rebuild @jitsi/robotjs against the packaged Electron ABI
files:
  - dist/**
  - platform/**
  - package.json
  - LICENSE
asar: true
compression: maximum

# Elevation model: the GUI runs asInvoker — Chromium screen capture breaks under elevation.
# Lid-close keep-awake is done by a one-shot elevated helper (see platform/windows/power.js),
# so the user sees ONE UAC prompt at launch (optional) instead of running the whole app as admin.
# NSIS itself elevates at install time (perMachine).
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]
  requestedExecutionLevel: asInvoker
  icon: dist/icon.ico
nsis:
  perMachine: true
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: RemoteX

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.utilities
  icon: dist/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  # signing/notarization is a release decision: set CSC_LINK + APPLE_ID creds in CI
  # when a Developer ID is available; unsigned builds require right-click > Open.

linux:
  target:
    - AppImage
    - deb
    - rpm
  # electron-builder derives executableName from package.json "name" by default;
  # "@remotex/agent" produces "@remotexagent", which AppImage rejects
  executableName: remotex-agent
  category: Utility
  icon: dist/icon.png
  desktop:
    entry:
      Name: RemoteX
      Comment: Control this computer from a browser
      Categories: Utility;Network;

publish:
  provider: github
  owner: X5Coder
  repo: remotex
  releaseType: release
