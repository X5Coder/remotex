appId: com.remotex.app
productName: RemoteX
copyright: Copyright (c) 2026 RemoteX contributors
directories:
  output: release

# Every artifact is named exactly after the product — RemoteX.<ext>:
# RemoteX.exe (Windows installer), RemoteX.dmg (macOS), RemoteX.AppImage (Linux).
# The release contains exactly one build per platform, named after the app itself.
artifactName: RemoteX.${ext}

# release title/tag comes from git (tag v6.0.0) — no fixed releaseInfo here;
# the GitHub release is created with notes by the maintainer.
npmRebuild: true # rebuild @jitsi/robotjs against the packaged Electron ABI
files:
  - dist/**
  - platform/**
  - package.json
  - LICENSE
asar: true
compression: maximum

# Elevation model: the GUI runs asInvoker — Chromium screen capture breaks under
# elevation. Lid-close keep-awake is done by a one-shot elevated helper (see
# platform/windows/power.js), so the user sees ONE UAC prompt at launch (optional)
# instead of running the whole app as admin. NSIS itself elevates at install time.
win:
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: asInvoker
  icon: dist/icon.ico
nsis:
  perMachine: true
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: RemoteX

mac:
  target:
    - target: dmg
      arch: [universal]
  # universal merge: koffi ships per-arch Mach-O binaries (@koromix/koffi-darwin-*).
  # Both temp app dirs contain BOTH variants (npm installs arm64 on the runner and CI
  # unpacks x64 next to it), so the two identical arm64 Mach-O files must be declared
  # x64-specific or @electron/universal refuses the merge. robotjs differs per arch and
  # is lipo'd as usual; every identical .node file stays on both slices and koffi loads
  # the right one at runtime.
  x64ArchFiles: "**/*.node"
  category: public.app-category.utilities
  icon: dist/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  # signing/notarization is a release decision: set CSC_LINK + APPLE_ID creds in CI
  # when a Developer ID is available; unsigned builds require right-click > Open.

linux:
  target:
    - target: AppImage
      arch: [x64]
  executableName: remotex
  category: Utility
  icon: dist/icon.png
  desktop:
    entry:
      Name: RemoteX
      Comment: Control this computer from a browser
      Categories: Utility;Network;

publish:
  provider: github
  owner: X5Coder
  repo: remotex
  releaseType: release
